# CI for Bytefry: a Windows-only desktop host (WinForms + WebView2) that serves a
# dependency-free web layer from app/ beside the executable.
#
# No house ci/ template covers this stack (a .NET 10 WinForms host plus a
# dependency-free Node test suite), so this is a project workflow shaped like the
# house ones: same name, windows-latest, read-only token.
#
# Every step is headless-safe. The one check that needs a real window -
# build.mjs --verify, which parks an off-screen WebView2 window to compose the app -
# is NOT run here; the last step says so out loud.
#
# Order is provenance -> portable build -> host tests -> web tests. The provenance
# checks need only Node and fail in seconds; the publish then produces
# dist/portable/Bytefry.exe, so the host suite drives the shipped single-file
# binary rather than a framework-dependent apphost.
#
# One command per step, on purpose: a step's shell reports only the last exit code,
# so two commands in one block let the first failure be masked (measured here:
# node exit 3 then node exit 0 leaves the block at 0). The steps are Node and bash
# because this repository carries no PowerShell.
#
# Public CI runs on pushes and pull requests; manual runs remain available.
# A docs-only change (*.md, docs/, LICEN[CS]E) keeps the required check green and runs no build.
name: ci

on:
  push:
    branches: [main]
    # Path scope is a fact computed from the diff; an author's skip claim is not a trigger - only the fact is allowed.
    paths-ignore: ['**/*.md', 'docs/**', 'LICEN[CS]E']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Detect a docs-only change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          docs='^(.+\.md|docs/.+|LICEN[CS]E)$'
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # One API read is the diff itself: no merge base to fetch, no full history to carry.
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
            n=$(printf '%s\n' "$files" | grep -c . || true)
            if [ "$n" -gt 0 ] && ! printf '%s\n' "$files" | grep -qvE "$docs"; then
              code=false
              echo "no code changed: docs only ($n files)"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.code == 'true'
        with:
          dotnet-version: 10.0.x

      # The web-layer suite runs on Node and needs a global WebSocket, so Node 22
      # or newer; lts/* satisfies that. No lockfile: app/ and tests/ ship no
      # runtime dependencies.
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: lts/*

      # Bundled-source provenance: each script re-derives the shipped bundle from
      # the vendored upstream tree beside it and fails on any drift - bytes, line
      # endings, file count, and the registration/method surface the sources
      # declare. Offline, dependency-free, read-only, seconds to run, and they
      # need nothing but Node, so they gate before the publish.
      - name: Verify bundled CamanJS source
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: node third_party/camanjs/verify.mjs

      - name: Verify bundled glfx source
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: node third_party/glfx/verify.mjs

      # Publish the portable folder: dist/portable/Bytefry.exe, self-contained and
      # single-file, with app/ and NOTICE.md beside it. The installer (--installer,
      # Inno Setup 6) is a release artefact, not a per-push gate; the image does
      # carry the Inno Setup compiler if that ever changes.
      - name: Build the portable host
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: node desktop/build.mjs --configuration Release

      # Window-free: no Form, no WebView2, no message box. Covers app-folder
      # resolution, the bridge host, the injected script, packaging invariants,
      # the icon, the command line, and the self-check report gate.
      - name: Test the host
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: node desktop/test.mjs --configuration Release

      # Deterministic gates only: drop-safety and load-parity, with no wall-clock
      # assertion anywhere, so a busy runner cannot turn this red. The suite serves
      # app/ on loopback and drives a browser with `--headless=new`, a throwaway
      # profile and stdio ignored, so no window is created. Speed is measured
      # separately by `node tests/bench.mjs`: opt-in, numbers only, and it fails
      # solely on a byte-parity divergence, which this suite already gates.
      #
      # Browser discovery is a fixed candidate list: FRYER_CHROME, then Chrome
      # under Program Files, then Program Files (x86), then Brave Nightly, then
      # Edge under Program Files (x86) - where a 64-bit Windows keeps msedge.exe.
      # windows-latest ships both Chrome and Edge, so no environment variable is
      # needed; set FRYER_CHROME only if an image ever moves one of them.
      - name: Test the web layer
        if: steps.scope.outputs.code == 'true'
        shell: bash
        run: node tests/run.mjs

      - name: The off-screen self-check is not run here
        shell: bash
        run: |
          echo 'Skipped: node desktop/build.mjs --verify parks a window outside every monitor'
          echo 'for WebView2 to compose the page. A hosted runner cannot be trusted to'
          echo 'compose it, so the check stays opt-in. Run it locally:'
          echo '  node desktop/build.mjs --verify'

      - name: Scope
        if: always()
        run: |
          echo "scope: ${{ steps.scope.outputs.code == 'true' && 'code changed - the full gate ran' || 'docs-only - build skipped, the check stays green' }}"
