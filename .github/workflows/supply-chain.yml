name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - name: Restore
        run: dotnet restore
      - name: Audit dependencies
        run: |
          dotnet list package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "Vulnerable packages found" >&2
            exit 1
          fi
